<ion-view view-title="PetRadar - Alerte">
  <ion-content>
    <ion-list>
      <ion-item
        ng-repeat="pet in pets"
        href="#"
        ui-sref="pet-detail({id: pet.id})">

        <h2>{{pet.name}} ({{pet.species}})</h2>
        <p>Status: <strong>{{pet.status}}</strong> | Locație: {{pet.location}}</p>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-view>
