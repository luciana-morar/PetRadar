<ion-view view-title="PetRadar" hide-back-button="true">
  <ion-content>
    <form class="list padding" ng-submit="login()">
      <label class="item item-input">
        <span class="input-label">Utilizator</span>
        <input type="text" ng-model="form.username" autocapitalize="off" autocomplete="username"
               placeholder="ana">
      </label>

      <label class="item item-input">
        <span class="input-label">Parolă</span>
        <input type="password" ng-model="form.password" autocomplete="current-password"
               placeholder="1234">
      </label>

      <p class="error-text" ng-if="error">{{ error }}</p>

      <button type="submit" class="button button-block button-dark margin-top"
              ng-disabled="loading || !form.username || !form.password">
        {{ loading ? 'Se conectează...' : 'Autentificare' }}
      </button>
    </form>
  </ion-content>
</ion-view>
