<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
  <title>PetRadar</title>

  <link href="lib/ionic/css/ionic.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <!-- ionic/angularjs js -->
  <script src="lib/ionic/js/ionic.bundle.js"></script>

  <!-- cordova script -->
  <script src="cordova.js"></script>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <!-- your app's js -->
  <script src="js/modules.js"></script>
  <!-- Controllers -->
  <script src="js/controllers/AppCtrl.js"></script>
  <script src="js/controllers/LoginCtrl.js"></script>
  <script src="js/controllers/PetsCtrl.js"></script>
  <script src="js/controllers/PetDetailCtrl.js"></script>
  <script src="js/controllers/PetFormCtrl.js"></script>
  <script src="js/services/ApiConfig.js"></script>
  <script src="js/services/Store.js"></script>

  <!-- Services -->
  <script src="js/services/Store.js"></script>
  <script src="js/services/NetworkService.js"></script>
  <script src="js/services/AuthService.js"></script>
  <script src="js/services/PetRepository.js"></script>
  <script src="js/services/SocketService.js"></script>

  <script src="js/app.js"></script>
</head>

<body ng-app="starter" ng-controller="AppCtrl">
<ion-nav-bar class="bar-light">
  <ion-nav-back-button></ion-nav-back-button>
</ion-nav-bar>

<ion-nav-view></ion-nav-view>

<!-- Banda de stare: online / offline + modificari netrimise -->
<div class="net-banner" ng-class="net.online ? 'net-online' : 'net-offline'">
  <span>{{ net.online ? 'Online' : 'Offline' }}</span>
  <span ng-if="pendingCount > 0"> · {{ pendingCount }} modificări netrimise la server</span>
</div>
</body>

</html>
