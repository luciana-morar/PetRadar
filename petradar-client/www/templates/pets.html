<ion-view view-title="Alerte Animale">
  <ion-nav-buttons side="right">
    <button class="button button-clear" ng-click="logout()">Logout ({{ auth.username() }})</button>
  </ion-nav-buttons>

  <ion-content>
    <ion-refresher pulling-text="Trage pentru reîncărcare" on-refresh="refresh(true)"></ion-refresher>

    <div class="padding">
      <button class="button button-block button-outline button-dark" ui-sref="pet-form({id: 'new'})">
        + Adaugă o alertă nouă
      </button>
    </div>

    <!-- Cautare + filtru -->
    <div class="filter-bar">
      <label class="item item-input">
        <input type="search" placeholder="Caută (nume, specie, locație...)"
               ng-model="filter.search" ng-model-options="{debounce: 400}" ng-change="reset()">
      </label>
      <label class="item item-input item-select">
        <div class="input-label">Status</div>
        <select ng-model="filter.status" ng-change="reset()">
          <option value="">Toate</option>
          <option value="pierdut">Pierdut</option>
          <option value="găsit">Găsit</option>
        </select>
      </label>
    </div>

    <ion-list>
      <ion-item ng-repeat="pet in items track by pet.id" ui-sref="pet-detail({id: pet.id})">
        <h2>
          {{ pet.name }} ({{ pet.species }})
          <span class="pending-tag" ng-if="pet._pending">nesincronizat</span>
        </h2>
        <p>Status: <strong>{{ pet.status }}</strong> | Locație: {{ pet.location }}</p>
      </ion-item>
    </ion-list>

    <div class="padding" ng-if="!loading && items.length === 0">
      <p style="text-align:center">Nu există alerte.</p>
    </div>

    <ion-infinite-scroll ng-if="hasMore" on-infinite="loadMore()" distance="1%">
      <ion-infinite-scroll-content
        loading-spinner="ios"
        loading-text="Se încarcă mai multe alerte...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>

  </ion-content>
</ion-view>
